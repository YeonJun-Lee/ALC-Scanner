<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2e04a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Pallet Check"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style><script>window.PC_HOSTED=true</script></head><body><title>Pallet Sequence Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column floor tool. Sticky status bar, big "next slot" card, scan controls, then the slot list styled like the printed sheet. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1d2124; --muted:#5d666b; --line:#d5d9d6;
  --hi:#f2e04a; --hi-ink:#2a2600;          /* the yellow highlighter on the printed sheet */
  --ok:#1f7a45; --ok-bg:#dff1e5; --bad:#b3261e; --bad-bg:#fbe3e0; --warn:#8a5a00; --warn-bg:#fdf0d2;
  --btn:#1d2124; --btn-ink:#ffffff;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141719; --surface:#1d2124; --ink:#eef0ee; --muted:#9aa3a7; --line:#343a3e;
  --hi:#e8d43c; --hi-ink:#1f1c00;
  --ok:#5cc98a; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1714; --warn:#f0c060; --warn-bg:#352a10;
  --btn:#eef0ee; --btn-ink:#141719; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --surface:#1d2124; --ink:#eef0ee; --muted:#9aa3a7; --line:#343a3e;
  --hi:#e8d43c; --hi-ink:#1f1c00;
  --ok:#5cc98a; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1714; --warn:#f0c060; --warn-bg:#352a10;
  --btn:#eef0ee; --btn-ink:#141719; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
.sheetname{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.count{font-family:var(--mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
button,.btn{font-family:var(--display);font-weight:600;font-size:17px;border:0;border-radius:10px;padding:14px 16px;cursor:pointer;
  background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;text-align:center}
button:focus-visible,.btn:focus-within,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.small{min-height:40px;padding:8px 12px;font-size:15px}
button:disabled{opacity:.45;cursor:default}
.btn.scan{background:var(--hi);color:var(--hi-ink);font-size:22px;min-height:76px;width:100%}
.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn{position:relative}
.next{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.next .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.next .meta b{color:var(--ink);font-family:var(--mono);font-weight:700;letter-spacing:0;text-transform:none;font-size:16px}
.bigcode{font-family:var(--mono);font-weight:700;font-size:clamp(56px,20vw,92px);line-height:1;letter-spacing:.04em;
  background:var(--hi);color:var(--hi-ink);border-radius:8px;padding:10px 14px;align-self:flex-start}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.result{border-radius:12px;padding:14px 16px;font-size:18px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.result small{font-weight:400;font-size:15px}
.result.ok{background:var(--ok-bg);color:var(--ok)}
.result.bad{background:var(--bad-bg);color:var(--bad)}
.result.warn{background:var(--warn-bg);color:var(--warn)}
.result.info{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.result .mono{font-family:var(--mono)}
.flash-bad{animation:fb .6s}
@keyframes fb{0%,40%{box-shadow:0 0 0 6px var(--bad)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash-bad{animation:none}.bar>i{transition:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;font-family:var(--mono);font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-transform:uppercase}
table{width:100%;border-collapse:collapse;background:var(--surface);font-variant-numeric:tabular-nums}
.tablebox{border:1.5px solid var(--ink);border-radius:4px;overflow-x:auto}
th{font-weight:500;font-size:13px;color:var(--muted);text-align:center;padding:8px 4px;border-bottom:1.5px solid var(--ink);background:var(--bg)}
td{border-top:1px solid var(--line);padding:9px 4px;text-align:center;font-family:var(--mono);font-size:15px}
td.seq{background:color-mix(in srgb,var(--hi) 55%,transparent);color:var(--ink)}
td.code{font-weight:700;font-size:16px}
td.st{width:84px;font-family:var(--display);font-size:13px;font-weight:600}
tr.cur td{background:var(--hi);color:var(--hi-ink)}
tr.done td{color:var(--muted)}
tr.done td.st{color:var(--ok)}
tr.skipped td.st{color:var(--warn)}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.setup h2{margin:0;font-size:20px}
.setup p{margin:0;color:var(--muted);max-width:60ch}
.manual input::placeholder,textarea::placeholder{text-transform:none}
textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:16px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-transform:uppercase}
.note{font-size:14px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.done-card{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.done-card h2{margin:0;font-size:26px}
  font-family:var(--mono);font-weight:700;font-size:28px;color:#fff;text-shadow:0 1px 4px #000;transition:border-color .15s}
.diag{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diag.got{color:var(--ok)}
.waitsheet{align-items:center;text-align:center;padding:32px 16px;gap:16px}
.waitsheet h2{font-size:26px;text-wrap:balance}
.qrmark{width:96px;height:96px;position:relative;animation:pulse 1.6s ease-in-out infinite}
.qrmark i{position:absolute;width:34px;height:34px;border:7px solid var(--ink);border-radius:4px}
.qrmark i:nth-child(1){top:0;left:0}.qrmark i:nth-child(2){top:0;right:0}.qrmark i:nth-child(3){bottom:0;left:0}
.qrmark i:nth-child(4){bottom:8px;right:8px;width:18px;height:18px;border:0;background:var(--hi)}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.qrmark{animation:none}}
.flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));text-align:center}
.flash b{font-family:var(--display);font-weight:700;font-size:clamp(48px,16vw,96px);line-height:1;letter-spacing:.02em}
.flash span{font-family:var(--mono);font-weight:700;font-size:clamp(28px,10vw,56px)}
.flash.green{background:#1f9d55;color:#fff}
.flash.red{background:#d32f2f;color:#fff}
.flash.yellow{background:#f2d60f;color:#1d1a00}
.flash.go{animation:flashfade var(--fd,900ms) ease-out forwards}
@keyframes flashfade{0%,55%{opacity:.96}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){@keyframes flashfade{0%,90%{opacity:.96}100%{opacity:0}}}
.example-tag{font-size:12px;background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;align-self:flex-start}
</style>

<div class="flash" id="flash" aria-hidden="true"><b id="flashWord"></b><span id="flashSub"></span></div>
<div class="wrap">
  <header>
    <div class="hrow">
      <div style="min-width:0">
        <h1>Pallet Check</h1>
        <div class="sheetname" id="sheetName">No sheet loaded</div>
      </div>
      <div class="count" id="count">0 / 0</div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="diag" id="diag">Scanner: waiting for a scan</div>
  </header>

  <!-- WAITING FOR A SHEET -->
  <section class="setup waitsheet" id="setup" hidden>
    <div class="qrmark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h2>Scan the QR code on the sheet</h2>
    <div class="result warn" id="sheetStatus" hidden></div>
    <button class="ghost" id="cancelNew" hidden>Back to current sheet</button>
  </section>

  <!-- SCANNING PARTS -->
  <section id="run" hidden style="display:flex;flex-direction:column;gap:14px">
    <span class="example-tag" id="exampleTag" hidden>Example sheet</span>
    <div class="next" id="nextCard">
      <div class="meta"><span>Slot <b id="nSlot">–</b></span><span>Seq <b id="nSeq">–</b></span><span>Body <b id="nBody">–</b></span></div>
      <div class="lbl">Next part</div>
      <div class="bigcode" id="nCode">----</div>
    </div>
    <div class="done-card" id="doneCard" hidden>
      <h2>Pallet complete</h2>
      <div id="doneText"></div>
    </div>
    <div class="result warn" id="switchBar" hidden>
      <span id="switchText"></span>
      <div class="row2" style="margin-top:6px"><button class="small" id="switchYes">Switch sheet</button><button class="small ghost" id="switchNo">Keep current</button></div>
    </div>
    <div class="result info" id="result">Scan the first part.</div>
  </section>

  <button class="btn scan" id="newSheet">New sheet</button>

  <div class="tablebox" id="runTable" hidden><table><thead><tr><th>Slot</th><th>Seq</th><th>Body No</th><th id="runCodeHead">Code</th><th>Status</th></tr></thead><tbody id="runBody"></tbody></table></div>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const KEY = "palletcheck.v1";

// Example: the sheet from the user's photo (Line 1 D/Trim FL 7)
const EXAMPLE = {name:"Line 1 · D/Trim · FL · 7", codeHead:"Q023", example:true, rows:[
 [1,133,"5I 082950","NX0Y"],[2,134,"5I 083084","N1AB"],[3,135,"5I 082939","NX0Y"],[4,136,"5I 082948","NX0B"],
 [5,137,"5I 082979","N1AY"],[6,138,"5I 083017","NW0B"],[7,139,"5I 083007","N1AY"],[8,140,"5I 082870","NX0Y"],
 [9,141,"5I 083022","N1AB"],[10,142,"5I 082949","NX0Y"],[11,143,"5I 083020","N1AB"],[12,144,"5I 083043","N1AB"],
 [13,145,"5I 083008","N1AB"],[14,146,"5I 083024","N1AK"],[15,147,"5I 082947","N1AB"],[16,148,"5I 083021","N1AB"],
 [17,149,"5I 082977","N1AB"],[18,150,"5I 083064","N1AB"],[19,151,"5I 083041","N1AB"],[20,152,"5I 083019","N1AB"]
].map(([slot,seq,body,code])=>({slot,seq:String(seq),body,code,status:"pending"}))};

let S = null;          // {name, codeHead, rows:[{slot,seq,body,code,status,serial,part}], history:[idx], example}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)||"null"); if(v && Array.isArray(v.rows)) return v; }catch(e){} return null; }

const norm = c => String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/O/g,"0").replace(/I/g,"1");

// ---------- barcode parsing ----------
function parseLabel(raw){
  let t = String(raw||"").trim()
    .replace(/␝/g,"\x1d").replace(/␞/g,"\x1e").replace(/␄/g,"\x04");
  const out = {raw:t, code:null, part:null, serial:null};
  if(/^[A-Za-z0-9]{4}$/.test(t)){ out.code = t.toUpperCase(); return out; }
  const fields = t.split(/[\x1d\x1e\x04]/).map(f=>f.trim()).filter(Boolean);
  if(fields.length > 2){
    for(const f of fields){
      if(!out.code && /^S[A-Z0-9]{4}$/i.test(f)) out.code = f.slice(1).toUpperCase();
      else if(!out.part && /^P[A-Z0-9_\-]{6,}$/i.test(f)) out.part = f.slice(1);
      else if(!out.serial && /^T\w{6,}$/i.test(f)) out.serial = f.slice(1);
    }
  }
  if(!out.code){ // scanner gun that drops the separator characters
    const m = t.match(/P([A-Z0-9_]{6,}?)S([A-Z0-9]{4})T(\d{6}\w+?)(?:E|C:|$)/i);
    if(m){ out.part=m[1]; out.code=m[2].toUpperCase(); out.serial=m[3]; }
  }
  return out;
}

// ---------- feedback ----------
let actx = null;
function beep(good){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = good ? "sine" : "square"; o.frequency.value = good ? 1320 : 220;
    g.gain.value = .15; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (good ? .12 : .5));
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(good ? 60 : [200,80,200,80,300]); }catch(e){}
}
// full-screen colour flash: green = correct, red = wrong, yellow = scan again
function flash(color, word, sub){
  const f = $("flash"); if(!f) return;
  $("flashWord").textContent = word || ""; $("flashSub").textContent = sub || "";
  f.style.setProperty("--fd", color==="green" ? "900ms" : color==="red" ? "1800ms" : "1400ms");
  f.className = "flash " + color; void f.offsetWidth; f.className = "flash " + color + " go";
}
function showResult(kind, html, sub){
  const r = $("result"); r.className = "result " + kind; r.innerHTML = html;
  if(kind==="ok") flash("green", "OK", sub);
  else if(kind==="bad") flash("red", "WRONG", sub);
  else if(kind==="warn") flash("yellow", "SCAN AGAIN", sub);
  if(kind==="bad"){ r.classList.remove("flash-bad"); void r.offsetWidth; r.classList.add("flash-bad"); }
}
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- check logic ----------
function curIdx(){ return S ? S.rows.findIndex(r=>r.status==="pending") : -1; }
function checkScan(parsed){
  if(!S) return;
  const i = curIdx();
  if(i<0){ showResult("info","All slots are done. Load the next sheet."); return; }
  if(!parsed.code){
    beep(false);
    showResult("warn", `Couldn't find a 4-character code in that scan.<small class="mono">${esc(parsed.raw.slice(0,80))}</small>`);
    return;
  }
  if(parsed.serial){
    const dup = S.rows.find(r=>r.serial===parsed.serial);
    if(dup){ beep(false); showResult("bad", `Already scanned: this label is in slot ${dup.slot}.<small class="mono">Serial ${esc(parsed.serial)}</small>`); flash("red","ALREADY SCANNED",`Slot ${dup.slot}`); return; }
  }
  const row = S.rows[i];
  if(norm(parsed.code)===norm(row.code)){
    row.status="ok"; row.serial=parsed.serial||null; row.part=parsed.part||null;
    S.history.push(i); save(); beep(true);
    const nx = curIdx();
    showResult("ok", `Slot ${row.slot} OK: ${esc(parsed.code)}` + (nx>=0 ? `<small>Next: slot ${S.rows[nx].slot}, ${esc(S.rows[nx].code)}</small>` : ""), parsed.code);
    render();
    return true;
  } else {
    beep(false);
    const later = S.rows.findIndex((r,k)=>k>i && r.status!=="ok" && norm(r.code)===norm(parsed.code));
    const where = later>=0 ? `That part goes in slot ${S.rows[later].slot}.` : `That code isn't on this sheet.`;
    showResult("bad", `Wrong order. Scanned <span class="mono">${esc(parsed.code)}</span>, slot ${row.slot} needs <span class="mono">${esc(row.code)}</span>.<small>${where}</small>`, `${parsed.code} → needs ${row.code}`);
  }
  render();
}

// ---------- rendering ----------
function show(view){
  $("setup").hidden = view!=="setup"; $("run").hidden = view!=="run"; $("runTable").hidden = view!=="run";
  $("cancelNew").hidden = !(view==="setup" && S && curIdx() >= 0);
  $("newSheet").hidden = view==="setup";
}
function render(){
  if(!S){ $("sheetName").textContent="No sheet loaded"; $("count").textContent="0 / 0"; $("barFill").style.width="0"; return; }
  const done = S.rows.filter(r=>r.status==="ok").length, n = S.rows.length;
  $("sheetName").textContent = S.name || "Sequence sheet";
  $("count").textContent = `${done} / ${n}`;
  $("barFill").style.width = n ? (100*done/n)+"%" : "0";
  $("exampleTag").hidden = !S.example;
  $("runCodeHead").textContent = S.codeHead || "Code";
  const i = curIdx();
  $("nextCard").hidden = i<0; $("doneCard").hidden = i>=0;
  if(i>=0){ const r=S.rows[i]; $("nSlot").textContent=r.slot; $("nSeq").textContent=r.seq||"–"; $("nBody").textContent=r.body||"–"; $("nCode").textContent=r.code; }
  else {
    $("doneText").textContent = `All ${n} parts scanned in order. Press New sheet for the next pallet.`;
  }
  $("runBody").innerHTML = S.rows.map((r,k)=>{
    const cls = k===i ? "cur" : r.status==="ok" ? "done" : r.status==="skipped" ? "skipped" : "";
    const st = r.status==="ok" ? "✓ OK" : r.status==="skipped" ? "Skipped" : k===i ? "Next" : "";
    return `<tr class="${cls}"><td>${esc(r.slot)}</td><td class="seq">${esc(r.seq)}</td><td>${esc(r.body)}</td><td class="code">${esc(r.code)}</td><td class="st">${st}</td></tr>`;
  }).join("");
}
function startFrom(d){
  S = {name:d.name, codeHead:d.codeHead, example:!!d.example, history:[],
       rows:d.rows.filter(r=>r.code).map(r=>({slot:r.slot,seq:r.seq,body:r.body,code:String(r.code).toUpperCase(),status:"pending"}))};
  save(); show("run"); showResult("info","Scan the first part."); render();
}

// ---------- scanning ----------
// USB / Bluetooth scanners type like a keyboard. Catch a scan anywhere on the run screen,
// even when the input box isn't focused, ending on Enter or Tab.
let kbuf = "", klast = 0, kfirst = 0, ktimer = null;
function diag(text, how){
  const d = $("diag"); if(!d) return;
  const t = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"});
  const shown = String(text).replace(/[\x1d\x1e\x04]/g,"·");
  d.className = "diag got"; d.textContent = `Scanner ${t} · ${how} · ${shown.length} chars · ${shown.slice(0,60)}`;
}
function flushKeys(how){
  clearTimeout(ktimer); ktimer = null;
  const v = kbuf; kbuf = "";
  if(v.trim().length >= 4){ diag(v, how); handleScan(v); }
}
document.addEventListener("keydown", e=>{
  if($("run").hidden && $("setup").hidden) return;
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const now = Date.now();
  if(now - klast > 1500){ kbuf = ""; kfirst = now; }   // stale partial input
  klast = now;
  if(e.key === "Enter" || e.key === "Tab"){
    if(kbuf.trim().length >= 4){ e.preventDefault(); flushKeys("Enter"); }
    kbuf = ""; return;
  }
  if(e.ctrlKey && e.key === "]"){ kbuf += "\x1d"; e.preventDefault(); return; }   // GS sent as Ctrl+]
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length === 1){
    kbuf += e.key; e.preventDefault();
    // scanners without an Enter suffix: a fast burst of keys followed by a pause counts as one scan
    clearTimeout(ktimer);
    ktimer = setTimeout(()=>{
      const fast = kbuf.length >= 4 && (klast - kfirst) / Math.max(1, kbuf.length - 1) < 45;
      if(fast) flushKeys("no Enter"); 
    }, 250);
  }
});
function newSheet(){ $("switchBar").hidden = true; pendingSheet = null; show("setup"); $("sheetStatus").hidden = true; render(); }
$("newSheet").addEventListener("click", newSheet);
$("cancelNew").addEventListener("click", ()=>{ show("run"); render(); });

// ---------- sheet barcode (QR printed on the sheet) ----------
// Format: PCK1|<sheet name>|<code column header>|<slot>,<seq>,<body>,<code>;...
const isSheetCode = raw => /^\s*PCK1\|/i.test(String(raw||""));
function decodeSheet(raw){
  const parts = String(raw).trim().split("|");
  if(parts.length < 4) return null;
  const rows = parts.slice(3).join("|").split(";").map(x=>x.trim()).filter(Boolean).map((x,k)=>{
    const c = x.split(",").map(v=>v.trim());
    return c.length >= 4 ? {slot:c[0]||k+1, seq:c[1], body:c[2], code:c[3].toUpperCase()} : {slot:k+1, seq:"", body:"", code:c[c.length-1].toUpperCase()};
  }).filter(r=>r.code);
  return rows.length ? {name:parts[1], codeHead:parts[2]||"Code", rows} : null;
}
let pendingSheet = null;
function handleScan(raw){
  if(!isSheetCode(raw)){
    if($("run").hidden){                              // label scanned while no sheet is open
      beep(false);
      const st = $("sheetStatus"); st.hidden = false; st.className = "result warn"; flash("yellow", "SCAN SHEET FIRST");
      st.innerHTML = "That's a part label. Scan the QR code on the sheet first.";
      return;
    }
    checkScan(parseLabel(raw)); return;
  }
  const sh = decodeSheet(raw);
  if(!sh){ beep(false); show("run"); showResult("warn","That sheet barcode is incomplete. Scan it again."); return; }
  if($("setup").hidden && S && S.name === sh.name && S.rows.length === sh.rows.length && !S.example){
    show("run"); beep(true); showResult("info", `Sheet ${esc(sh.name)} is already loaded.`); render(); return;
  }
  const inProgress = $("setup").hidden && S && !S.example && S.rows.some(r=>r.status!=="pending") && curIdx() >= 0;
  if(inProgress){
    pendingSheet = sh; show("run"); beep(true);
    const done = S.rows.filter(r=>r.status==="ok").length;
    $("switchText").textContent = `Switch to ${sh.name || "the new sheet"}? ${S.name || "This sheet"} has ${done} of ${S.rows.length} scanned.`;
    $("switchBar").hidden = false; flash("yellow","NEW SHEET?"); return;
  }
  beep(true); startFrom(sh);
  showResult("ok", `Loaded ${esc(sh.name || "sheet")}: ${sh.rows.length} slots.<small>Scan the first part.</small>`, "SHEET LOADED");
}
$("switchYes").addEventListener("click", ()=>{
  $("switchBar").hidden = true; if(!pendingSheet) return;
  const sh = pendingSheet; pendingSheet = null; startFrom(sh);
  showResult("ok", `Loaded ${esc(sh.name || "sheet")}: ${sh.rows.length} slots.<small>Scan the first part.</small>`, "SHEET LOADED");
});
$("switchNo").addEventListener("click", ()=>{ $("switchBar").hidden = true; pendingSheet = null; });

// ---------- boot ----------
S = load() || (window.PC_HOSTED ? null : EXAMPLE);
if(S && !S.history) S.history=[];
if(S){ show("run"); render(); } else { show("setup"); render(); }
// offline support when served from the hosted copy
if(window.PC_HOSTED && "serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
window.__test = {parseLabel, checkScan, get state(){return S;}};
})();
</script>
